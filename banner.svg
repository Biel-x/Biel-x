<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" role="img" aria-label="BT System — websites, APIs e jogos — JavaScript + Python">
  <defs>
    <linearGradient id="tblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0f6fe0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f5f5" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5f5f5" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="revealA">
      <rect x="272" y="130" width="0" height="34">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.16;0.5;0.51;1" values="0;280;280;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="revealB">
      <rect x="290" y="130" width="0" height="34">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.5;0.64;1" values="0;0;245;245"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="820" height="190" rx="14" fill="#050508"/>

  <!-- rastros de velocidade -->
  <g>
    <rect x="150" y="52" width="150" height="7" rx="3.5" fill="url(#fadeL)" filter="url(#soft)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.25;0.7;0.25"/>
    </rect>
    <rect x="175" y="72" width="125" height="7" rx="3.5" fill="url(#fadeL)" filter="url(#soft)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.6;0.2;0.6"/>
    </rect>
    <rect x="200" y="92" width="100" height="7" rx="3.5" fill="url(#fadeL)" filter="url(#soft)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.3;0.65;0.3"/>
    </rect>
    <rect x="520" y="62" width="140" height="7" rx="3.5" fill="url(#fadeR)" filter="url(#soft)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.55;0.2;0.55"/>
    </rect>
    <rect x="520" y="84" width="110" height="7" rx="3.5" fill="url(#fadeR)" filter="url(#soft)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.2;0.6;0.2"/>
    </rect>
  </g>

  <!-- wordmark BT -->
  <g transform="translate(410 84) skewX(-10)" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" text-anchor="middle">
    <text x="0" y="0" fill="#1E90FF" opacity="0.4" filter="url(#soft)">BT</text>
    <text x="0" y="0"><tspan fill="#f5f5f5">B</tspan><tspan fill="url(#tblue)">T</tspan></text>
  </g>

  <!-- subtítulo -->
  <text x="414" y="116" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="10">
    <tspan fill="#1E90FF">BT</tspan><tspan fill="#e8edf3"> SYSTEM</tspan>
  </text>

  <!-- linha digitada: frase A -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.46;0.5;1" values="1;1;0;0"/>
    <text x="277" y="155" clip-path="url(#revealA)" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#9fb6cc">Websites, APIs e jogos</text>
    <rect y="134" width="3" height="27" fill="#1E90FF">
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.16;0.5;1" values="279;547;547;279"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;0.51;1" values="1;1;0;0"/>
    </rect>
  </g>

  <!-- linha digitada: frase B -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.51;0.97;1" values="0;0;1;1;0"/>
    <text x="295" y="155" clip-path="url(#revealB)" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#9fb6cc">JavaScript + Python</text>
    <rect y="134" width="3" height="27" fill="#1E90FF">
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.64;1" values="297;297;527;527"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;0.51;1" values="1;1;0;0"/>
    </rect>
  </g>
</svg>
